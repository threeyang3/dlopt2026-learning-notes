name: Prepare language-model materials validation
on:
  push:
    branches: ['feat/language-models-2026-11-03']
    paths: ['.github/workflows/language-models-prep.yml']
permissions:
  contents: read
jobs:
  materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: tar -czf /tmp/language-model-materials.tgz materials
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-model-materials
          path: /tmp/language-model-materials.tgz
          retention-days: 1
