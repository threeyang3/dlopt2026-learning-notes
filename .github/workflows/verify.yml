name: Verify course notes
# Automatic note checks run in website.yml (PR) and pages.yml (main).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check links, structure, math syntax, and checksums
        run: python3 tools/check_notes.py
      - name: Run numerical and content regression tests
        run: python3 tools/test_math_notes.py
      - name: Check the note checker itself
        run: python3 tools/test_check_notes.py
