name: Verify course notes
# Automatic note checks run in website.yml (PR) and pages.yml (main).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check links, structure, math syntax, and checksums
        run: python3 tools/check_notes.py
      - name: Run numerical and content regression tests
        run: python3 tools/test_math_notes.py
      - name: Check the note checker itself
        run: python3 tools/test_check_notes.py
