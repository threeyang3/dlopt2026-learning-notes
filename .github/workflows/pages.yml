name: Deploy learning lab to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run audit
      - run: npm run audit:runtime
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Install CJK fonts for readable Chinese browser evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npx --no-install playwright install chromium
      - run: npm run e2e
        env:
          E2E_PREVIEW: '1'
          BASE_PATH: /${{ github.event.repository.name }}/
          TEST_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify original materials
        working-directory: .
        run: |
          python3 tools/check_notes.py
          python3 tools/test_math_notes.py
          python3 tools/test_check_notes.py
      - name: Stamp the validated release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const commit = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(commit ?? '')) throw Error('Missing build commit');
          fs.writeFileSync('dist/version.json', JSON.stringify({ version, commit }, null, 2) + '\n');
          JS
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
