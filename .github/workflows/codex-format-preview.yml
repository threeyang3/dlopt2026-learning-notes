name: Temporary formatter preview
# Re-trigger the full verification workflow after formatter output is committed.

on:
  push:
    branches:
      - codex/stabilize-learning-lab-2026-10-26
    paths:
      - .github/workflows/codex-format-preview.yml

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/stabilize-learning-lab-2026-10-26
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Apply repository formatter
        working-directory: website
        run: |
          sed -i '/prettier-ignore/d' src/App.tsx src/tests/notes.test.ts e2e/core.spec.ts
          npm run format
          npm run format:check
      - name: Commit formatter output to candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/App.tsx website/src/tests/notes.test.ts website/e2e/core.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to stabilization changes"
            git push origin HEAD:codex/stabilize-learning-lab-2026-10-26
          fi
