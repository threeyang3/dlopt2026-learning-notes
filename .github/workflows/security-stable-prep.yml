name: Prepare reviewed dependency lock
on:
  push:
    branches: ['fix/security-stable-2026-11-01']
    paths: ['.github/workflows/security-stable-prep.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve only the approved manifest and check advisories
        working-directory: website
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
      - name: Commit only the generated lockfile to the candidate branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const branch = 'fix/security-stable-2026-11-01';
            if (context.ref !== 'refs/heads/' + branch) throw new Error('Unexpected ref');
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/' + branch });
            if (ref.object.sha !== context.sha) throw new Error('Branch advanced; aborting stale lock update');
            const path = 'website/package-lock.json';
            const { data: current } = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
            const content = fs.readFileSync(path);
            const lock = JSON.parse(content.toString('utf8'));
            if (lock.version !== '1.0.1') throw new Error('Unexpected version');
            await github.rest.repos.createOrUpdateFileContents({ ...context.repo, path, branch, sha: current.sha, message: 'Lock patched KaTeX and Vitest dependencies after zero-advisory audit', content: content.toString('base64') });
