name: Verify interactive learning lab
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run audit
      - run: npm run audit:runtime
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install chromium
      - run: npm run e2e
        env:
          E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: website-test-results
          path: website/test-results/
      - name: Preserve original course verification
        working-directory: .
        run: |
          python3 tools/check_notes.py
          python3 tools/test_math_notes.py
          python3 tools/test_check_notes.py
