name: Verify interactive learning lab
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run e2e
        env:
          E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: website/test-results/
      - name: Preserve original course verification
        working-directory: .
        run: |
          python3 tools/check_notes.py
          python3 tools/test_math_notes.py
          python3 tools/test_check_notes.py
